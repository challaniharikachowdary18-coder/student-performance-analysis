{% extends "base.html" %}{% block content %}
<h1>Add student</h1><form method="post" class="form-card">
<div class="mb-3"><label class="form-label">Roll number</label><input class="form-control" name="roll_no" required></div>
<div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" required></div>
<div class="mb-3"><label class="form-label">Section</label><input class="form-control" name="section" required></div>
<button class="btn btn-primary">Save student</button> <a class="btn btn-light" href="{{ url_for('students') }}">Cancel</a></form>
{% endblock %}
