{% extends "base.html" %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1>Students</h1><a class="btn btn-primary" href="{{ url_for('add_student') }}">Add student</a></div>
<div class="table-responsive"><table class="table table-striped"><thead><tr><th>Roll no.</th><th>Name</th><th>Section</th><th>Actions</th></tr></thead><tbody>
{% for s in students %}<tr><td>{{ s.roll_no }}</td><td>{{ s.name }}</td><td>{{ s.section }}</td><td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('edit_student',student_id=s.student_id) }}">Edit</a>
<form class="d-inline" method="post" action="{{ url_for('delete_student',student_id=s.student_id) }}" onsubmit="return confirmDelete()"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>
{% else %}<tr><td colspan="4">No students yet.</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
