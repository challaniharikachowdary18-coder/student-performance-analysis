{% extends "base.html" %}{% block content %}
<h1>Edit student</h1><form method="post" class="form-card">
<div class="mb-3"><label class="form-label">Roll number</label><input class="form-control" name="roll_no" value="{{ student.roll_no }}" required></div>
<div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ student.name }}" required></div>
<div class="mb-3"><label class="form-label">Section</label><input class="form-control" name="section" value="{{ student.section }}" required></div>
<button class="btn btn-primary">Update</button> <a class="btn btn-light" href="{{ url_for('students') }}">Cancel</a></form>
{% endblock %}
